<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Track your Hannan Computers & Printers online order using your tracking number.">
<title>Track Your Order | Hannan Computers & Printers</title>
<link rel="stylesheet" href="assets/vendor/bootstrap-icons.css">
<link rel="stylesheet" href="assets/styles.css?v=20261011-track-order">
<script src="assets/data.js" defer></script>
<script src="assets/app.js?v=20261011-customer-email1" defer></script>
<script src="assets/track-order.js?v=20261011-tracking-only" defer></script>
<style>
.track-wrap{max-width:760px;margin:42px auto 70px}.track-card{background:#fff;border:1px solid #dbe6f3;border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:0 18px 50px rgba(8,45,90,.09)}.track-card h1{margin:8px 0 10px}.track-form{display:grid;gap:16px;margin-top:24px}.track-form label{display:grid;gap:7px;font-weight:700}.track-form input{width:100%;padding:13px 14px;border:1px solid #cbd8e8;border-radius:10px;font:inherit}.track-status{margin-top:20px}.track-result{margin-top:20px;border:1px solid #dbe6f3;border-radius:14px;padding:18px}.track-result h2{margin:0 0 14px}.track-result dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0}.track-result dt{color:#64748b;font-size:.88rem}.track-result dd{margin:3px 0 0;font-weight:800;overflow-wrap:anywhere}.track-pill{display:inline-block;background:#e8f2ff;color:#0759cf;padding:7px 12px;border-radius:99px;font-weight:800}.track-steps{display:grid;gap:10px;margin-top:18px}.track-step{padding:11px 13px;border-radius:10px;background:#f4f7fb}.track-step.current{background:#e8f2ff;border:1px solid #b8d6ff}.track-help{color:#64748b;font-size:.94rem}.track-result[hidden]{display:none}@media(max-width:540px){.track-result dl{grid-template-columns:1fr}}
</style>
</head>
<body data-page="track">
<div id="site-header"></div>
<main class="shell">
<section class="track-wrap">
<div class="track-card">
<span class="eyebrow">HCS ONLINE SHOP</span>
<h1>Track Your Order</h1>
<p>Enter the tracking number shown after placing your order.</p>
<form class="track-form" id="track-form">
<label>Tracking Number<input name="orderId" required maxlength="60" placeholder="Example: HCS-20261011-ABC123" autocomplete="off"></label>
<button class="button primary full-width" type="submit"><i class="bi bi-search"></i> Check Order Status</button>
</form>
<p class="track-status form-status" id="track-status" role="status" aria-live="polite"></p>
<section class="track-result" id="track-result" hidden></section>
<p class="track-help">Keep your tracking number safe. For help, contact Hannan Computers & Printers at 0334-6395391.</p>
</div>
</section>
</main>
<div id="site-footer"></div>
</body>
</html>
